services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=3000
    expose:
      - "3000"

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../backend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=4000
    expose:
      - "4000"

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
