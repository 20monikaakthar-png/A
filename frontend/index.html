<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mushfiqur OS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        background: linear-gradient(120deg, #181c2b, #0d111d);
        color: #f3f4f6;
      }
      .desktop {
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      .panel {
        max-width: 640px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 2rem;
        backdrop-filter: blur(8px);
      }
      code {
        background: rgba(0, 0, 0, 0.3);
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main class="desktop">
      <section class="panel">
        <h1>Mushfiqur OS</h1>
        <p>Desktop UI service is running.</p>
        <p>API root expected at <code>/api</code> through reverse proxy.</p>
      </section>
    </main>
  </body>
</html>
